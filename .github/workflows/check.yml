name: repository-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_repository.py
      - name: Parse PowerShell entrypoints
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem -LiteralPath . -Filter *.ps1 -Recurse | Where-Object { $_.FullName -notlike '*\.git\*' } | ForEach-Object {
            $parseTokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
